<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Kube-Quest 코인 획득 테스트</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #game-board { 
      width: 600px; height: 400px; 
      border: 3px solid #333; 
      position: relative; 
      background: #f4f4f4; 
      cursor: crosshair;
      overflow: hidden;
    }
    .player { 
      width: 20px; height: 20px; 
      position: absolute; 
      border-radius: 50%; 
      transform: translate(-50%, -50%); 
      transition: left 0.1s, top 0.1s; 
    }
    .me { background: #e74c3c; z-index: 10; border: 2px solid #c0392b; } 
    .other { background: #3498db; border: 2px solid #2980b9; } 
    
    /* 새로 추가된 코인 스타일 */
    .coin {
      width: 15px; height: 15px;
      position: absolute;
      background: #f1c40f; /* 금색 */
      border-radius: 50%;
      border: 2px solid #f39c12;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 5px rgba(241, 196, 15, 0.8);
      z-index: 5;
    }

    /* 스코어보드 UI */
    #scoreboard {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #333;
      padding: 10px;
      font-size: 14px;
      z-index: 20;
      min-width: 150px;
    }
    .score-item { margin-bottom: 5px; font-weight: bold; }
    .my-score { color: #e74c3c; } /* 내 점수는 빨간색으로 강조 */

    /* 채팅창 UI */
    #chat-container {
      width: 600px; margin-top: 10px; border: 2px solid #333; background: #fff;
    }
    #chat-box {
      height: 150px; overflow-y: auto; padding: 10px; font-size: 14px; border-bottom: 1px solid #ccc;
    }
    .chat-msg { margin-bottom: 5px; }
    .chat-my-msg { color: #e74c3c; font-weight: bold; }
    #chat-input-area { display: flex; padding: 5px; background: #f4f4f4; }
    #chat-input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    #chat-send-btn { margin-left: 5px; padding: 8px 15px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>🎯 Kube-Quest 코인 파밍 맵</h2>
  <p>보드를 클릭해 이동하며 생성되는 노란색 코인을 획득해 보세요!</p>
  <div id="game-board">
    <div id="scoreboard">
      <strong>🏆 실시간 순위표</strong>
      <div id="score-list"></div>
    </div>
  </div>

  <div id="chat-container">
    <div id="chat-box"></div>
    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="메시지를 입력하고 Enter를 누르세요" autocomplete="off">
      <button id="chat-send-btn">전송</button>
    </div>
  </div>


  <script>
    // 1. 소켓 서버 연결
    const socket = io('http://localhost:3000');
    const board = document.getElementById('game-board');

    const players = {}; // 화면에 그려진 다른 유저들 저장소
    const items = {}; // 화면에 있는 코인 데이터 저장

    const scores = {}; // 유저별 점수 저장소
    const scoreListEl = document.getElementById('score-list');

    // 내 캐릭터 DOM 생성
    const myAvatar = document.createElement('div');
    myAvatar.className = 'player me';
    board.appendChild(myAvatar);

     // 내가 처음 접속했을 때: Redis가 기억하는 기존 유저들 좌표 로드
    socket.on('initPositions', (positions) => {
      for (const [id, pos] of Object.entries(positions)){
        if (id !== socket.id) updateOtherPlayer(id, pos);
      }
    });

    // 누군가 움직였을 때 (Redis에 업데이트 됨과 동시에 브로드캐스팅 됨)
    socket.on('playerMoved', (data) => {
      if (data.clientId !== socket.id) updateOtherPlayer(data.clientId, data.position);
    });

    // 누군가 나갔을 때 (Redis에서 삭제됨)
    socket.on('playerDisconnected', (id) => {
      if (players[id]) {
        players[id].remove();
        delete players[id];
      }
    });

    // 1. 처음 접속 시 이미  깔려있는 코인들 그리기
    socket.on('initItems', (serverItems) => {
      for (const [id, pos] of Object.entries(serverItems)){
        drawItem(id, pos);
      }
    });

    // 2. 서버에서 새로운 코인이 생성되었을때 그리기 (5초마다)
    socket.on('itemSpawned', (data) => {
      drawItem(data.itemId, data.position);
    });

    // 3. 누군가 코인을 성공적으로 획득했을 때 화면에서 지우기
    socket.on('itemCollected', (data) => {
      if (items[data.itemId]) {
        items[data.itemId].element.remove(); // DOM에서 삭제
        delete items[data.itemId]; // 메모리에서 삭제

        // 내가 먹었다면
        if (data.clientId === socket.id) {
          console.log(`코인 획득 성공! ID: ${data.itemId}`);
        }
      }
    });

    // 처음 접속 시 모든 유저의 점수 세팅
    socket.on('initScores', (serverScores) => {
      Object.assign(scores, serverScores);
      renderScoreboard();
    });

    // 누군가 점수를 획득했을 때 화면 갱신
    socket.on('scoreUpdated', (data) => {
      scores[data.clientId] = data.score;
      renderScoreboard();
    });

    // 화면 클릭 시 내 좌표를 서버로 전송
    board.addEventListener('click', (e) => {
      const rect = board.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // 내 화면의 빨간 점 이동
      myAvatar.style.left = x + 'px';
      myAvatar.style.top = y + 'px';

      // 서버로 좌표 발송 -> 서버가 Redis에 HSET으로 덮어씀
      socket.emit('move', { x, y });

      // 내 캐릭터가 이동한 후, 근처에 코인이 있는지 체크
      checkItemCollision(x, y);
    });

    // 다른 유저(파란 점)를 화면에 그리거나 위치를 갱신하는 함수
    function updateOtherPlayer(id, pos) {
      if (!players[id]) {
        players[id] = document.createElement('div');
        players[id].className = 'player other';
        board.appendChild(players[id]);
      }
      players[id].style.left = pos.x + 'px';
      players[id].style.top = pos.y + 'px';
    }

    // 화면에 코인 그리기
    function drawItem(id, pos) {
      if (items[id]) return; // 이미 있다면 패스

      const coinEl = document.createElement('div');
      coinEl.className = 'coin';
      coinEl.style.left = pos.x + 'px';
      coinEl.style.top = pos.y + 'px';
      board.appendChild(coinEl);

      // 나중에 위치 비교를 위해 x, y 좌표도 함께 저장
      items[id] = { element: coinEl, x: pos.x, y: pos.y };
    }

    // 내 캐릭터 좌표와 코인들 좌표 비교하여 거리 체크
    function checkItemCollision(px, py) {
      for (const[id, coin] of Object.entries(items)) {
        // 피타고라스 정리로 두 점 사이의 거리 계산
        const dx = px - coin.x;
        const dy = py - coin.y;
        const distance = Math.sqrt(dx * dx + dy *dy);

        // 거리가 20px 이내로 가까워지면 획득한 것으로 간주
        if (distance < 20) {
          // 서버에 획득 요청을 보냄 (아직 화면에서 제거 x)
          socket.emit('collectItem', { itemId: id });
        }
      }
    }

    function renderScoreboard() {
      scoreListEl.innerHTML = '';

      // 점수를 기준으로 내림차순 정렬
      const sortedScores = Object.entries(scores).sort((a, b) => b[1] - a[1]);

      for (const [id, score] of sortedScores) {
        const div = document.createElement('div');
        div.className = 'score-item';

        // 내 ID면 빨간색 클래스 부여, 아니면 앞의 4자리만 보여주기
        if(id === socket.id) {
          div.classList.add('my-score');
          div.innerHTML = `내 (Me): ${score}점`;
        } else {
          div.innerText = `User_${id.substring(0, 4)}: ${score}점`;
        }

        scoreListEl.appendChild(div);
      }
    }

    // 채팅 관련 
    const chatBox = document.getElementById('chat-box');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send-btn');

    // 채팅 메시지를 화면에 그리는 함수
    function appendChatMessage(data) {
      const div = document.createElement('div');
      div.className = 'chat-msg';

      const userId = data.clientId === socket.id ? '나 (ME)' : `User_${data.clientId.substring(0, 4)}`;
      if (data.clientId === socket.id) div.classList.add('chat-my-msg');

      div.innerText = `[${userId}]: ${data.message}`;
      chatBox.appendChild(div);

      // 스크롤은 항상 맨 아래로
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 1. 처음 접속 시 과거 채팅 내역 조회
    socket.on('initChat', (chats) => {
      chats.forEach(chat => appendChatMessage(chat));
    });

    // 2. 누군가 새로운 채팅을 보냈을 때
    socket.on('chatMessage', (data) => {
      appendChatMessage(data);
    });

    // 3. 메시지 서버로 전송하기 (버튼 클릭 또는 Enter 키)
    function sendMessage() {
      const msg = chatInput.value;
      if (msg.trim() !== '') {
        socket.emit('sendMessage', { message: msg });
        chatInput.value = ''; // 입력창 초기화
      }
    }

    chatSendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

  </script>
</body>
</html>
